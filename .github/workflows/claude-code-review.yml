name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude security & code review
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--model claude-sonnet-4-5'
          track_progress: true
          prompt: |
            You are reviewing a PR in the zVault Solidity / Hardhat repo.

            === HOW TO POST YOUR REVIEW (READ THIS FIRST) ===
            You have GitHub MCP tools available for posting on the PR. Plain
            text in your final response will be HIDDEN and will NOT reach the
            PR. The only way your review reaches reviewers is through tool
            calls. You MUST use these tools:

            - `mcp__github_inline_comment__create_inline_comment` — call this
              ONCE per location-specific finding. Pass the file path, the
              line number, and the comment body. You may call it many times.
            - `mcp__github_comment__update_claude_comment` — call this ONCE
              at the very end with the full Markdown summary using the format
              given below. This updates the sticky review comment that the
              action pre-creates.

            If you finish your turn without calling
            `update_claude_comment`, your review will be invisible. Always
            end your work by calling `update_claude_comment` exactly once.

            === REVIEW PROCESS ===
            1. Read `CLAUDE.md` at the repo root for project context, roles,
               upgrade flow, and security invariants.
            2. Read every changed file in the PR diff.
            3. Perform a DEEP security-focused review of every changed
               `.sol` file and a general correctness review of everything
               else (TS scripts, deploy files, hardhat config, tests).
            4. For each location-specific issue, post one inline comment
               via `mcp__github_inline_comment__create_inline_comment`.
            5. Finish by calling `mcp__github_comment__update_claude_comment`
               exactly once with the summary in the format below.

            === Mandatory checks for Solidity changes ===
            - Access control: every external/public state-changing function
              is gated by the correct role from ZothAccessControl
              (DEPOSIT_VAULT_ADMIN_ROLE, REDEMPTION_VAULT_ADMIN_ROLE,
              ZOPAL_MINT_OPERATOR_ROLE, ZOPAL_BURN_OPERATOR_ROLE,
              ZOPAL_PAUSE_OPERATOR_ROLE, GREENLIST_OPERATOR_ROLE,
              BLACKLIST_OPERATOR_ROLE, GREENLISTED_ROLE, BLACKLISTED_ROLE).
            - Reentrancy: nonReentrant on any function that makes external
              calls AND mutates state; verify CEI ordering.
            - Upgradeability: storage layout preserved (no inserted/reordered
              vars in upgradeable contracts), __gap respected, no logic in
              constructors, initializer / reinitializer guards correct,
              _disableInitializers() in implementation constructors.
            - Oracle: staleness / heartbeat checks on Chainlink-style feeds,
              roundId / answeredInRound completeness, negative price guard,
              decimal normalization via DecimalsCorrectionLibrary.
            - Math: overflow risk inside `unchecked` blocks, decimals
              normalization correctness, rounding direction always favors
              the protocol (not the user) on deposit/redeem accounting.
            - External calls: return values checked (especially ERC20
              transfers — prefer SafeERC20), follow checks-effects-interactions.
            - Events: emitted on every meaningful state change
              (deposits, redemptions, role grants, pauses, oracle updates).
            - Pause / sanctions / blacklist / greenlist gates not bypassed
              on any user-facing entry point.
            - Timelock + multisig upgrade flow not bypassed
              (see scripts/timelock-upgrade-multisig.ts and
              scripts/transfer-proxyadmin.ts).
            - No hardcoded admin / treasury / oracle addresses inside
              contracts; they must come from access control or initializers.

            === Checks for TS / scripts / deploy ===
            - No hardcoded chain-specific addresses outside config/deployed/.
            - Env vars guarded (fail fast if missing) before any tx.
            - Deploy ordering correct (access control -> token -> oracle ->
              vaults -> timelock).
            - No accidental mainnet deploys behind a typoed network name.

            === Summary review format ===
            Pass this Markdown body to
            `mcp__github_comment__update_claude_comment`:

            ## Verdict
            APPROVE / REQUEST_CHANGES / COMMENT — one line of justification.

            ## Critical issues (blockers)
            - …
            (write "None" if empty)

            ## Suggestions (non-blocking)
            - …
            (write "None" if empty)

            ## Nits
            - …
            (write "None" if empty)

            Be concise. Inline comments should explain the issue and propose
            a fix snippet when reasonable.
