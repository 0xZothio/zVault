name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude security & code review
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--model claude-sonnet-4-5'
          track_progress: true
          prompt: |
            Review this pull request in the zVault Solidity / Hardhat repository.

            Read CLAUDE.md first, then inspect every changed file in the
            pull-request diff against origin/main.

            Perform a security-focused review of all changed Solidity files and a
            correctness review of TypeScript, deployment scripts, Hardhat config,
            and tests.

            Check especially:

            - Correct role-based access control
            - Reentrancy and checks-effects-interactions
            - Upgradeable storage layout and initializer safety
            - Oracle staleness, negative prices, round completeness, and decimals
            - Arithmetic overflow and rounding direction
            - Safe ERC20 transfers and checked return values
            - Events for meaningful state changes
            - Pause, sanctions, blacklist, and greenlist enforcement
            - Timelock and multisig upgrade flow
            - Hardcoded addresses
            - Missing environment-variable validation
            - Deployment ordering
            - Protection against accidental mainnet deployments

            Return a concise Markdown review with this format:

            ## Verdict
            APPROVE, REQUEST_CHANGES, or COMMENT — with one-line justification.

            ## Critical issues (blockers)
            - None, or list each blocker with file and line references.

            ## Suggestions (non-blocking)
            - None, or list suggestions.

            ## Nits
            - None, or list minor issues.

            Include a concrete fix snippet when useful.
            Write the review as your final response. Do not require GitHub MCP
            tools or `update_claude_comment`.
